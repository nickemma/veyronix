apiVersion: v1
kind: Secret
metadata:
  name: plinth-postgres
  namespace: plinth-system
type: Opaque
stringData:
  POSTGRES_USER: plinth
  POSTGRES_PASSWORD: change-me-before-production
  POSTGRES_DB: plinth
  PLINTH_DATABASE_DSN: postgres://plinth:change-me-before-production@postgres.plinth-system.svc.cluster.local:5432/plinth
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: plinth-system
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: plinth-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/managed-by: plinth
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: plinth-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
