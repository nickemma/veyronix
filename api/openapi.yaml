openapi: 3.0.3
info:
  title: Plinth API
  version: 0.1.0
  description: |
    The lifecycle API used by the Plinth CLI and test playground.
    Swagger UI is served at /docs and this contract at /openapi.yaml.
    X-Plinth-Actor and X-Plinth-Team identify the caller and team; both
    default to local/default for local development.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/teams:
    get:
      summary: List configured teams
      responses:
        '200':
          description: Teams
    post:
      summary: Register a team in the local policy store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Registered team
  /api/v1/audit:
    get:
      summary: Export audit records
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
      responses:
        '200':
          description: Audit records in JSON or CSV
  /api/v1/services:
    get:
      summary: List services
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      summary: Apply a service manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manifest'
      responses:
        '200':
          description: Applied service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/services/{name}:
    get:
      summary: Get service status
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/services/{name}/events:
    get:
      summary: List reconciliation events
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /api/v1/services/{name}/logs:
    get:
      summary: List reconciliation logs
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogLine'
  /api/v1/services/{name}/rollback:
    post:
      summary: Roll back to a previous revision
      parameters:
        - $ref: '#/components/parameters/Name'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  description: Historical revision to restore; empty means last known good.
      responses:
        '200':
          description: Rollback result
          content:
            application/json:
              schema:
                type: object
  /api/v1/services/{name}/pause:
    post:
      summary: Pause reconciliation
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Paused service
  /api/v1/services/{name}/resume:
    post:
      summary: Resume reconciliation
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Resumed service
  /api/v1/services/{name}/destroy:
    post:
      summary: Delete backend resources while retaining history
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: Destroyed service
  /api/v1/services/{name}/test/drift:
    post:
      summary: Test helper that deletes one fake resource and reconciles
      parameters:
        - $ref: '#/components/parameters/Name'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  example: Deployment
      responses:
        '200':
          description: Drift repair result
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Healthy
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    Manifest:
      type: object
      required: [name, image, port, replicas, resources]
      properties:
        name: {type: string, example: tessera-gateway}
        namespace: {type: string, description: Set by the selected team policy}
        image: {type: string, example: ghcr.io/nickemma/tessera:v0.4.1}
        port: {type: integer, example: 8080}
        replicas: {type: integer, example: 3}
        env: {type: object, additionalProperties: {type: string}}
        secrets: {type: array, items: {type: string}}
        resources:
          type: object
          required: [cpu, memory]
          properties:
            cpu: {type: string, example: 500m}
            memory: {type: string, example: 512Mi}
        rollout:
          type: object
          properties:
            enabled: {type: boolean}
            steps: {type: array, items: {type: integer, minimum: 1, maximum: 100}}
            max_error_rate: {type: number, minimum: 0, maximum: 1}
    Service:
      type: object
      properties:
        name: {type: string}
        team: {type: string}
        desired_revision: {type: integer}
        active_revision: {type: integer}
        last_known_good: {type: integer}
        phase: {type: string, example: ready}
        message: {type: string}
        observed: {type: array, items: {type: string}}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        logs: {type: array, items: {$ref: '#/components/schemas/LogLine'}}
        history: {type: array, items: {$ref: '#/components/schemas/Revision'}}
        updated_at: {type: string, format: date-time}
    Revision:
      type: object
      properties:
        number: {type: integer}
        manifest: {$ref: '#/components/schemas/Manifest'}
        created_at: {type: string, format: date-time}
        reason: {type: string}
    Event:
      type: object
      properties:
        time: {type: string, format: date-time}
        type: {type: string}
        message: {type: string}
    LogLine:
      type: object
      properties:
        time: {type: string, format: date-time}
        stream: {type: string}
        message: {type: string}
    Team:
      type: object
      required: [name, namespace, service_quota]
      properties:
        name: {type: string, example: payments}
        members: {type: array, items: {type: string}}
        namespace: {type: string, example: plinth-payments}
        service_quota: {type: integer, minimum: 1, example: 20}
