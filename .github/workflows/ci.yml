name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

# NOTE ON SCOPE
# This workflow gates what exists: build, lint, unit tests, architecture, and
# integration tests (real Postgres + Redis). It grows as the code does.

jobs:
  #   # ─────────────────────────────────────────────────────────
  #   # Job 1: Build — does the binary compile?
  #   # ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Build binary
        run: make build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wellspring-binary
          path: bin/wellspring
          retention-days: 1

  #   # ─────────────────────────────────────────────────────────
  #   # Job 2: Lint — code style and static analysis checks
  #   # ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

  #   # ─────────────────────────────────────────────────────────
  #   # Job 3: Unit tests — fast, no external dependencies
  #   # ─────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: go test ./... -count=1 -race -timeout 60s -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  #   # ─────────────────────────────────────────────────────────
  #   # Job 4: Architecture: horizontal + vertical boundary enforcement
  #   # ─────────────────────────────────────────────────────────
  arch:
    name: Architecture
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Architecture meta-tests
        # Verifies the linter still CATCHES violations — not just that current
        # code passes. This is the meta-test.
        run: make arch-test
      - name: Lint the tree
        run: make arch

  #   # ─────────────────────────────────────────────────────────
  #   # Job 5: Integration: adapters against REAL Postgres + Redis
  #   # ─────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit, arch]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellspring
          POSTGRES_PASSWORD: wellspring
          POSTGRES_DB: wellspring
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wellspring -d wellspring"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # bitnami (not redis:7-alpine) because GitHub service containers can't
        # override the container command, and the official image won't read a
        # password from env — bitnami does. Same password, intentional image diff.
        image: bitnami/redis:7
        env:
          REDIS_PASSWORD: wellspring
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli -a wellspring ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_ADMIN_DSN: postgres://wellspring:wellspring@localhost:5432/wellspring?sslmode=disable
      POSTGRES_DSN: postgres://wellspring_app:wellspring_app@localhost:5432/wellspring?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: wellspring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run migrations (as admin — creates the app role + schema)
        run: make migrate-up
      - name: Run integration tests (as the app role — RLS applies)
        run: make test-integration

  #   # ─────────────────────────────────────────────────────────
  #   # Gate: every job above must pass to merge
  #   # ─────────────────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [build, lint, test-unit, arch, test-integration]
    if: always()
    steps:
      - name: Check results
        run: |
          fail=0
          check() {
            if [[ "$2" != "success" ]]; then echo "✗ $1: $2"; fail=1; else echo "✓ $1"; fi
          }
          check "Build"        "${{ needs.build.result }}"
          check "Lint"         "${{ needs.lint.result }}"
          check "Unit tests"   "${{ needs.test-unit.result }}"
          check "Architecture" "${{ needs.arch.result }}"
          check "Integration"  "${{ needs.test-integration.result }}"
          exit $fail
